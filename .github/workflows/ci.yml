name: Source and Core checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Audit tracked sources
        run: python tools/check_publication.py --tracked
      - name: Install worker test dependencies
        run: python -m pip install -r requirements.txt
      - name: Python contracts with synthetic data
        run: python -m unittest discover -s tests -p '*tests.py' -v
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.8.3'
          cache: false
      - name: Linux Qt platform dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - name: Configure portable Core (no inference SDK)
        run: cmake -S . -B build-core -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" -DBUILD_TESTING=ON -DWORKBENCH_BUILD_APP=OFF -DWORKBENCH_BUILD_INTEGRATION_TESTS=OFF
      - name: Build
        run: cmake --build build-core --config Release --parallel 2
      - name: Core and coordinate-text contracts
        run: ctest --test-dir build-core -C Release --output-on-failure
